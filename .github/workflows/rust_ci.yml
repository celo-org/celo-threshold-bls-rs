name: Rust CI
on:
  push:
    branches: [ main ]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  cargo-tests:
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: rustfmt
      - uses: taiki-e/install-action@nextest
      - name: cargo test
        run: cargo nextest run --workspace --all-features

  cargo-lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
          components: rustfmt,clippy
      - name: lint
        run: just lint
      - name: fmt
        run: just fmt

  cargo-build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      - name: build
        run: cargo build --all-targets --all-features

  cargo-audit:
    runs-on: ubuntu-latest
    name: audit
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      - uses: taiki-e/install-action@cargo-audit
      - name: audit
        run: cargo audit

  # cross/threshold.h is generated from ffi.rs. This regenerates it, compiles it
  # as C11, C99, C++, Objective-C and Objective-C++, and fails if the committed
  # copy is stale.
  header:
    runs-on: ubuntu-latest
    name: header
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      # The shared setup action installs Just and Rust only, and
      # `just generate-header` refuses to run without the pinned cbindgen.
      - name: install cbindgen
        run: just install-cbindgen
      - name: check header
        run: just check-header
      # Compiles the C smoke test against that header, links it to the real
      # library and runs it. Rust tests cannot catch a header/library mismatch.
      - name: check ABI
        run: just check-abi

  wasm-pkg-tests:
    runs-on: ubuntu-latest
    name: wasm-pkg-tests
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: build
        run: cd crates/threshold-bls-ffi && wasm-pack build --target nodejs -- --features=wasm
      - name: Upload wasm pkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: crates/threshold-bls-ffi/pkg

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run wasm package tests
        run: |
          mkdir -p bindings/js/src
          cp crates/threshold-bls-ffi/pkg/blind* bindings/js/src/
          cd bindings/js
          npm ci
          npm test
