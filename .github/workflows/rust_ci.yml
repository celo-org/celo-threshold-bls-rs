name: Rust CI
on:
  push:
    branches: [ main ]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  cargo-tests:
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: rustfmt
      - uses: taiki-e/install-action@nextest
      - name: cargo test
        run: cargo nextest run --locked --workspace --all-features
      # nextest does not run doctests, and they are the crate's primary usage
      # documentation, so they need their own invocation.
      - name: cargo test --doc
        run: cargo test --locked --workspace --all-features --doc
      # The rustdoc is the API documentation consumers read. Nothing checked it,
      # which is how links to a trait renamed years ago survived.
      - name: cargo doc
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
          components: rustfmt,clippy
      - name: lint
        run: just lint
      - name: fmt
        run: just fmt

  cargo-build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      - name: build
        run: cargo build --locked --all-targets --all-features

  cargo-audit:
    runs-on: ubuntu-latest
    name: audit
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      - uses: taiki-e/install-action@cargo-audit
      - name: audit
        run: cargo audit

  # cross/threshold.h is generated from ffi.rs. This regenerates it, compiles it
  # as C11, C99, C++, Objective-C and Objective-C++, and fails if the committed
  # copy is stale.
  header:
    runs-on: ubuntu-latest
    name: header
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      # The shared setup action installs Just and Rust only, and
      # `just generate-header` refuses to run without the pinned cbindgen.
      - name: install cbindgen
        run: just install-cbindgen
      - name: check header
        run: just check-header
      # Compiles the C smoke test against that header, links it to the real
      # library and runs it. Rust tests cannot catch a header/library mismatch.
      - name: check ABI
        run: just check-abi

  wasm-pkg-tests:
    runs-on: ubuntu-latest
    name: wasm-pkg-tests
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/wasm-pkg
      - name: Upload wasm pkg artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: crates/threshold-bls-ffi/pkg
