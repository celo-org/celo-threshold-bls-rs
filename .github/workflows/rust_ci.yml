name: Rust CI
on:
  push:
    branches: [ main ]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  cargo-tests:
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: rustfmt
      - uses: taiki-e/install-action@nextest
      - name: cargo test
        run: cargo nextest run --locked --workspace --all-features
      # nextest does not run doctests, and they are the crate's primary usage
      # documentation, so they need their own invocation.
      - name: cargo test --doc
        run: cargo test --locked --workspace --all-features --doc
      # The rustdoc is the API documentation consumers read. Nothing checked it,
      # which is how links to a trait renamed years ago survived.
      - name: cargo doc
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
          components: rustfmt,clippy
      - name: lint
        run: just lint
      - name: fmt
        run: just fmt

  cargo-build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      - name: build
        run: cargo build --locked --all-targets --all-features

  cargo-audit:
    runs-on: ubuntu-latest
    name: audit
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      - uses: taiki-e/install-action@cargo-audit
      - name: audit
        run: cargo audit

  # cross/threshold.h is generated from ffi.rs. This regenerates it, compiles it
  # as C11, C99, C++, Objective-C and Objective-C++, and fails if the committed
  # copy is stale.
  header:
    runs-on: ubuntu-latest
    name: header
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      # The shared setup action installs Just and Rust only, and
      # `just generate-header` refuses to run without the pinned cbindgen.
      - name: install cbindgen
        run: just install-cbindgen
      - name: check header
        run: just check-header
      # Compiles the C smoke test against that header, links it to the real
      # library and runs it. Rust tests cannot catch a header/library mismatch.
      - name: check ABI
        run: just check-abi

  wasm-pkg-tests:
    runs-on: ubuntu-latest
    name: wasm-pkg-tests
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
      # Pinned to the version in the Dockerfile, and checksummed, so this job
      # tests a package built by the same wasm-pack that builds the published
      # one. The installer script takes whatever is newest instead.
      - name: install wasm-pack
        env:
          WASM_PACK_VERSION: 0.14.0
          WASM_PACK_SHA256: 278a8d668085821f4d1a637bd864f1713f872b0ae3a118c77562a308c0abfe8d
        run: |
          curl -fsSL -o /tmp/wasm-pack.tar.gz \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin --strip-components=1 \
            -f /tmp/wasm-pack.tar.gz "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
      - name: build
        run: just wasm-pkg
      # The Rust struct behind this class is named WasmKeypair, so that ffi.rs
      # can keep its own Keypair without cbindgen emitting the typedef twice.
      # js_name/js_class hold the exported name in place; assert that here
      # rather than relying on the downstream suite, which tracks a moving
      # branch and could go red or green for unrelated reasons.
      - name: Check the exported declarations are unchanged
        run: |
          decls=crates/threshold-bls-ffi/pkg/blind_threshold_bls.d.ts
          grep -q '^export class Keypair {' "$decls"
          grep -q 'export function keygen(seed: Uint8Array): Keypair;' "$decls"
          ! grep -q 'WasmKeypair' "$decls"
      - name: Upload wasm pkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: crates/threshold-bls-ffi/pkg

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run wasm package tests
        run: |
          mkdir -p bindings/js/src
          cp crates/threshold-bls-ffi/pkg/blind* bindings/js/src/
          cd bindings/js
          npm ci
          npm test
