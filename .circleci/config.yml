version: 2.1

commands:
  install-just:
    description: Install the just command runner into ~/bin
    steps:
      - run:
          name: Install just
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
              | bash -s -- --tag 1.57.0 --to "$HOME/bin"
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"

jobs:
  build-wasm:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - install-just
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build WASM
          command: just wasm
      - store_artifacts:
          path: output/wasm

  build-jvm:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - install-just
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build JVM
          command: just jvm
      - store_artifacts:
          path: output/jvm

  build-android:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - install-just
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Android
          command: just android
      - store_artifacts:
          path: output/android

  build-ios:
    macos:
      xcode: 15.4
    steps:
      - checkout
      - install-just
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
            source "$HOME/.cargo/env"
      - run:
          name: Build iOS
          command: just ios
      - store_artifacts:
          path: output/ios

workflows:
  version: 2
  build:
    jobs:
      - build-wasm
      - build-jvm
      - build-android
      - build-ios
