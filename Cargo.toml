[workspace]
resolver = "2"

members = [
    "crates/threshold-bls",
    "crates/threshold-bls-ffi",
]

# Fields shared by both crates. `rust-version` tracks the toolchain pinned in
# rust-toolchain.toml, which is the only version the builds are tested against.
[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/celo-org/celo-threshold-bls-rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false

# build all our deps in release mode 
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
incremental = true
debug-assertions = true
debug = true