[workspace]
resolver = "2"

members = [
    "crates/threshold-bls",
    "crates/threshold-bls-ffi",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
# Drops debug info and the symbol table from shipped binaries (~32% smaller
# Android .so, see issue #169). Panic messages still work; only Rust-side
# stack traces in crash reports are lost.
strip = "symbols"

# build all our deps in release mode 
[profile.dev.package."*"]
opt-level = 3

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false


[profile.test]
opt-level = 3
incremental = true
debug-assertions = true
debug = true