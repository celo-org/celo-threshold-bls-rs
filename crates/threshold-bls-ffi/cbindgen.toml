language = "C"
include_guard = "THRESHOLD_BLS_H"
documentation_style = "doxy"
autogen_warning = "/* Generated by `just generate-header`. Do not edit by hand. */"

# cbindgen renders `usize` as `uintptr_t` by default. The header this replaces
# used `size_t` for Buffer::len and free_vector's length, and the two are the
# same on every target we ship, so keep the spelling the consumer already has.
usize_is_size_t = true

# Every handle below is opaque to C: it only ever travels as a pointer, and the
# allocation is owned by Rust. They are forward-declared here and left out of
# generation because cbindgen cannot express either of them:
#
#   PrivateKey, PublicKey, Signature are aliases in lib.rs for associated types
#   of the fixed SigScheme, which cbindgen resolves to `Private`, `Public` and
#   `Signature` — names it cannot declare, the last one self-referential.
#
#   BlindingFactor is repr(transparent), which cbindgen renders as a typedef of
#   the wrapped type. That would put `typedef Token<PrivateKey> BlindingFactor;`
#   — Rust generic syntax — back into the header, which is what the wrapper
#   exists to avoid. The representation is load-bearing on the Rust side, so
#   declare the C view by hand rather than dropping it.
after_includes = """

typedef struct PrivateKey PrivateKey;
typedef struct PublicKey PublicKey;
typedef struct Signature Signature;
typedef struct BlindingFactor BlindingFactor;
"""

# There is deliberately no [defines] section, which is why generation logs
# "Missing `[defines]` entry for `feature = ffi`" once per item behind that
# feature. The entry cbindgen asks for maps the cfg onto a C macro and wraps
# every declaration in `#if defined(...)`. Nothing defines that macro today, so
# consumers would get a header that expands to nothing — the first error is
# `unknown type name 'Buffer'`. A noisy log beats an API that silently
# disappears.

[parse]
# Leave this false. With parse_deps = true cbindgen walks into threshold-bls and
# panics on the arkworks generics: "G1Curve has 0 params but is being
# instantiated with 1 values". The opaque wrappers in ffi.rs exist so it never
# has to look.
parse_deps = false

[export]
# WasmKeypair is wasm.rs's, not part of the C surface. cbindgen does not
# evaluate features, so it sees both modules and would emit it otherwise.
exclude = [
    "PrivateKey",
    "PublicKey",
    "Signature",
    "BlindingFactor",
    "WasmKeypair",
]
